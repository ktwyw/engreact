[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engreact"
version = "0.1.0"
description = "Chemical reaction engineering in Python: validated methods for kinetics, ideal and nonideal reactors, energy balances, catalysis, residence-time distributions and bioreactors, with an 18-notebook course."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanwei Wang", email = "wangyanwei@gmail.com" }]
keywords = ["chemical reaction engineering", "reactor design", "kinetics", "catalysis", "residence time distribution",
            "chemical engineering", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Education",
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.7", "pandas>=1.5", "jupyterlab>=4"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "pandas>=1.5", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6",
       "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/ktwyw/engreact"
Issues = "https://github.com/ktwyw/engreact/issues"
Validation = "https://github.com/ktwyw/engreact/blob/main/docs/VALIDATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engreact = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/engreact"]
addopts = "--doctest-modules"
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:engreact.*"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/*.ipynb", "solutions/*.ipynb"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E501"]
"tools/*" = ["E501", "E702"]
"notebooks/*.py" = ["E501", "E702"]
"solutions/*.py" = ["E501", "E702"]
"tests/*" = ["E501"]
"src/engreact/datasets.py" = ["E501"]
